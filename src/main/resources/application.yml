spring:
  application:
    name: CANBAGI

  datasource:
    username: postgres
    password: 12345
    url: jdbc:postgresql://localhost:5432/canbagidb
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

  servlet:
    context-path: /api/v1

logging:
  level:
    web: debug
    org:
      springframework:
        security: WARN